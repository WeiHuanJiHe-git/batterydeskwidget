plugins {
    id 'com.android.application'
}

android {
    namespace 'com.weihuanjihe.batterywidget'
    compileSdk 35

    defaultConfig {
        applicationId "com.weihuanjihe.batterywidget"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
